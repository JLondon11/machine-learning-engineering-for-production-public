name: Figure31 GLUE real experiment
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install torch transformers datasets evaluate accelerate scikit-learn pandas numpy matplotlib
      - run: python figure31_experiment/run_glue_hpo.py --outdir figure31_results
      - run: python figure31_experiment/render_figure31.py figure31_results/run_results.csv --out figure31_results/Figure31_GLUE.png
      - uses: actions/upload-artifact@v4
        with:
          name: figure31-glue-results
          path: figure31_results/
